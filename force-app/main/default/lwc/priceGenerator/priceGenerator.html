<template>
 <lightning-accordion allow-multiple-sections-open active-section-name={activeSections}>

    <lightning-accordion-section name="OpportunityDetails" label="Opportunity Details">
         <div class="section">
            <div class="two-column">
                <lightning-record-picker label="Account" object-api-name="Account" value={accountId} aria-placeholder="Search Accounts" onchange={handleAccountChange} filter={accountFilter} required></lightning-record-picker>
                <lightning-combobox label="Category"  value={categoryValue} options={categoryOptions} onchange={handleCategoryChange} required></lightning-combobox>
                <lightning-input label="Location" value={location} onchange={handleChange} data-field="Location"></lightning-input>
                <lightning-combobox label="Sub Category" value={subCategoryValue} options={subCategoryOptions} onchange={handleSubCategoryChange} disabled={isSubCategoryDisabled} required></lightning-combobox>
            </div>
        </div>
    </lightning-accordion-section>

    <lightning-accordion-section name="Competitors" label="Competitors">
    <template if:true={accountId}>
        <template if:true={hasCompetitors}>
            <lightning-datatable key-field="Id" data={competitors} columns={competitorColumns} hide-checkbox-column="true"></lightning-datatable>
        </template>

        <template if:false={hasCompetitors}>
            <p class="displayWarning">No Competitors found for the selected account.</p>
        </template>
    </template>
</lightning-accordion-section>

    <lightning-accordion-section name="Opportunities" label="Last Three Opportunities">
      <template if:true={accountId}>
         <template if:true={hasOpportunities}>
            <lightning-datatable key-field="Id" data={opportunities} columns={opportunityColumns} hide-checkbox-column="true"></lightning-datatable>
         </template>

         <template if:false={hasOpportunities}>
            <p class="displayWarning">No Opportunities found for the selected account.</p>
         </template>
      </template>
</lightning-accordion-section>

    <lightning-accordion-section name="Vendors" label="Vendors">
        <template if:true={selectedVendor}>
            <div class="opportunityButton">
               <lightning-button label="Create Opportunity" onclick={createOpportunity} ></lightning-button>
            </div>
        </template>

        <template if:true={hasVendors}>
            <lightning-datatable key-field="Id" data={filteredVendors} columns={supplierColumns} draft-values={draftValues}
                                 onsave={handleVendorSave} onrowselection={handleVendorSelection} max-row-selection="1">
            </lightning-datatable>
        </template>
        <template if:false={hasVendors}>
            <p class="displayWarning">No Vendors found for the selected categories.</p>
        </template>
    </lightning-accordion-section>
  </lightning-accordion>
</template>
